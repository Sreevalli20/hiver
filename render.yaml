services:
  - type: web
    name: hiver-backend
    runtime: python
    runtimeVersion: "3.12"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PORT
        value: "8000"
